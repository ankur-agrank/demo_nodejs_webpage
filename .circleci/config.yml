version: 2.1
jobs:
  build_test:
    docker:
      - image: circleci/node:12
    steps:
      - checkout
      - run:
          name: Install npm dependencies
          command: |
            npm install --save	
  build_docker_image:
    docker:
      - image: circleci/node:12
            steps:
              - checkout
              - run:
                  name: Login to Docker Registry
                  command: |
                    docker login -u $DOCKER_LOGIN -p $DOCKER_PASSWORD
              - run:
                  name: Build and Tag Docker Image
                  command: |
                    docker build -t $DOCKER_LOGIN/nodejswebapp:latest .
              - run:
                  name: Push Docker Image
                  command: |
                    docker push $DOCKER_LOGIN/nodejswebapp:latest

workflows:
  build_test:
    jobs:
      - build_test
      - build_docker_image
